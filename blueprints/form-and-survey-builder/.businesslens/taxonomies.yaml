scenarioKinds:
  - id: primary
    name: Primary
    description: The expected observable behavior path.
    colorSlot: 1
  - id: edge
    name: Edge case
    description: An uncommon but expected path with a distinct observable outcome.
    colorSlot: 6
  - id: validation
    name: Validation
    description: Input the Product refuses while preserving the Actor's work.
    colorSlot: 3
  - id: failure
    name: Failure
    description: A service the Product depends on cannot help, and the Product keeps the Actor's work.
    colorSlot: 5
