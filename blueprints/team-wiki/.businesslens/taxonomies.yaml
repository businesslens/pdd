scenarioKinds:
  - id: primary
    name: Primary
    description: The expected observable behavior path.
    colorSlot: 1
  - id: edge
    name: Edge case
    description: An uncommon but expected path with a distinct observable outcome.
    colorSlot: 6
  - id: validation
    name: Validation
    description: Input the Product refuses while preserving the Actor's work.
    colorSlot: 3
  - id: permission
    name: Permission
    description: An attempt the Actor's access does not allow, refused without revealing or changing anything.
    colorSlot: 5
  - id: conflict
    name: Conflict
    description: Work that meets a newer change by someone else and is reconciled rather than lost.
    colorSlot: 4
