<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 476" width="600" height="476" role="img" aria-labelledby="title">
<title id="title">The development loop: Ideate with /businesslens-ideate, Implement slice by slice with your own agent, Verify each slice with /businesslens-verify and loop back to Implement until it agrees, then back to Ideate.</title>
<style>
text{text-anchor:middle;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:20px;font-weight:600;letter-spacing:-0.5px;fill:#1b1713}
.note{font-size:14px;fill:#514839}
.cmd,.ownt,.mark{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.cmd{fill:#972600}
.ownt{fill:#695c48}
.mark{font-size:11px;font-weight:500;letter-spacing:2.4px;fill:#605440}
.pill{fill:#f9f4e9;stroke:#dbcfb4}
.own{fill:none;stroke:#c9b898;stroke-dasharray:4 3}
.ring{fill:none;stroke:#a06f31;stroke-width:.7;opacity:.65}
.t{stroke:#ab9d81;stroke-width:1;opacity:.55}
.c{stroke:#a06f31;stroke-width:1.75}
.disc{fill:#f4ecdb}
.arrow{fill:none;stroke:#b8965c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.curl{fill:none;stroke:#a06f31;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.swapnote{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.5px;fill:#695c48}
.dot{fill:#b8965c}
.dot-rest{display:none}
@media (prefers-reduced-motion:reduce){.dot-run{display:none}.dot-rest{display:inline}}
</style>
<rect x=".5" y=".5" width="599" height="475" rx="16" fill="#f4ecdb" stroke="#dbcfb4"/>
<text class="h" x="300" y="42">Ideate</text><rect class="pill" x="200.0" y="56" width="200" height="30" rx="8"/><text class="cmd" x="300" y="75.5">/businesslens-ideate</text><text class="note" x="300" y="110">Decide the next change and</text><text class="note" x="300" y="130">record it in the product model.</text>
<circle class="disc" cx="375.31" cy="184.52" r="12"/><path class="arrow" transform="translate(368.31 177.52) scale(0.5833)" d="M7 7l10 10 M17 7v10H7"/><circle class="disc" cx="224.69" cy="184.52" r="12"/><path class="arrow" transform="translate(217.69 177.52) scale(0.5833)" d="M7 7h10v10 M7 17L17 7"/>
<path class="ring" d="M257.61 295.84 A80 80 0 1 1 342.39 295.84"/>
<path class="curl" d="M342.39 295.84 C 326 305, 316 309, 306 309 C 284 309, 280 278, 300 278 C 320 278, 316 309, 294 309 C 284 309, 274 305, 257.61 295.84"/><path class="curl" d="M-6 -5.5 L1 0 L-6 5.5" transform="translate(257.61 295.84) rotate(212)"/>
<text class="swapnote" x="300" y="334">each slice</text>
<line class="c" x1="300.0" y1="145.39" x2="300.0" y2="150.61"/><line class="t" x1="341.3" y1="156.46" x2="338.7" y2="160.98"/><line class="t" x1="371.54" y1="186.7" x2="367.02" y2="189.3"/><line class="t" x1="382.61" y1="228.0" x2="377.39" y2="228.0"/><line class="c" x1="371.54" y1="269.3" x2="367.02" y2="266.7"/><line class="c" x1="228.46" y1="269.3" x2="232.98" y2="266.7"/><line class="t" x1="217.39" y1="228.0" x2="222.61" y2="228.0"/><line class="t" x1="228.46" y1="186.7" x2="232.98" y2="189.3"/><line class="t" x1="258.7" y1="156.46" x2="261.3" y2="160.98"/>
<text class="mark" x="301.2" y="224">BUSINESSLENS</text>
<text class="mark" x="301.2" y="242">PDD</text>
<circle class="dot dot-run" r="3.8"><animateMotion dur="22s" repeatCount="indefinite" path="M300 148 A80 80 0 0 1 342.39 295.84 C 326 305, 316 309, 306 309 C 284 309, 280 278, 300 278 C 320 278, 316 309, 294 309 C 284 309, 274 305, 257.61 295.84 A80 80 0 0 1 300 148"/></circle><circle class="dot dot-rest" cx="300" cy="148" r="3.8"/>
<text class="h" x="160" y="362">Verify</text><rect class="pill" x="60.0" y="376" width="200" height="30" rx="8"/><text class="cmd" x="160" y="395.5">/businesslens-verify</text><text class="note" x="160" y="430">Check and improve the code and</text><text class="note" x="160" y="450">product model until they agree.</text>
<text class="h" x="440" y="362">Implement</text><rect class="own" x="340.0" y="376" width="200" height="30" rx="8"/><text class="ownt" x="440" y="395.5">your agent, your way</text><text class="note" x="440" y="430">Slice by slice, with plan mode,</text><text class="note" x="440" y="450">an SDD tool, or freestyle.</text>
</svg>
