name: Site

# The pdd-kit.dev site is generated from this repository: its own pages in
# site/, plus docs/, CHANGELOG.md, blueprints/ and the report viewer and theme
# Layers. Any of those can change what it renders.
on:
  pull_request:
    paths:
      - site/**
      - docs/**
      - blueprints/**
      - layers/**
      - src/**
      - CHANGELOG.md
      - scripts/blueprints-release.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - blueprints/**
      - layers/**
      - src/**
      - CHANGELOG.md
      - scripts/blueprints-release.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Blueprint cards and the feed date each Blueprint from its Git history.
          fetch-depth: 0
      # Installs the exact pnpm pinned by package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm editorconfig
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:integration
      - run: pnpm generate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          CI: true
      - name: Upload the generated site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/.output/public
          retention-days: 7
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
