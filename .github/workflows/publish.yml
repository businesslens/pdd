name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'itai-gendler/pdd-kit' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The npm environment admits only v* tags, and the trusted publisher on
    # npmjs.com names it, so no other ref can mint a publishing token.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The repository's pinned pnpm, from package.json's packageManager. It
      # also serves the pnpm consumer smoke test below.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm publishes the packed tarball through trusted publishing (OIDC) and
      # stands in for npm consumers in the smoke test.
      - name: Use OIDC-capable npm
        run: npm install --global npm@11.9.0

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ${package_version}." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          package_version="$(node --print "require('./package.json').version")"
          pnpm pack --pack-destination "$pack_dir"
          tarball="$pack_dir/pdd-toolkit-${package_version}.tgz"
          test -f "$tarball"
          node scripts/check-package-size.mjs "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke-test release artifact
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          mkdir -p "$smoke_root/project/.claude" "$smoke_root/project/.agents"
          cd "$smoke_root/project"

          npx --yes --package "${{ steps.pack.outputs.tarball }}" pdd-kit --version
          npx --yes --package "${{ steps.pack.outputs.tarball }}" pdd-kit --help \
            | grep 'view \[options\]' >/dev/null
          npx --yes --package "${{ steps.pack.outputs.tarball }}" pdd-kit install \
            --providers claude,codex \
            --scope project \
            --yes

          cli_only="$smoke_root/cli-only"
          mkdir -p "$cli_only"
          npm install --prefix "$cli_only" --ignore-scripts "${{ steps.pack.outputs.tarball }}"
          node "$cli_only/node_modules/pdd-toolkit/dist/cli.js" --version
          (
            cd "$cli_only"
            node --input-type=module --eval \
              "import { PDD_KIT_DEFAULT_LIGHT_BACKGROUND } from 'pdd-toolkit/theme-lab/variants'; if (PDD_KIT_DEFAULT_LIGHT_BACKGROUND !== 'l4') process.exit(1)"
          )
          for ui_dependency in \
            nuxt \
            vue \
            elkjs \
            @vue-flow/core \
            @vue-flow/background \
            tailwindcss \
            @nuxt/ui \
            @fontsource-variable/archivo \
            @fontsource-variable/inter \
            @fontsource/ibm-plex-mono; do
            test ! -e "$cli_only/node_modules/$ui_dependency"
          done

          for skills_root in .claude/skills .agents/skills; do
            test -f "$skills_root/.pdd-kit-install.json"
            for skill in \
              pdd-map \
              pdd-ideate \
              pdd-verify; do
              test -f "$skills_root/$skill/SKILL.md"
            done
          done

          test ! -e product-model
          test ! -e AGENTS.md
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/dist/viewer/index.html$' >/dev/null
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/layers/nuxt/report-viewer/nuxt.config.ts$' >/dev/null
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/layers/nuxt/theme/nuxt.config.ts$' >/dev/null
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/layers/nuxt/theme-lab/nuxt.config.ts$' >/dev/null
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/layers/nuxt/theme/public/brand/icons/favicon.svg$' >/dev/null
          if tar -tzf "${{ steps.pack.outputs.tarball }}" \
            | grep '^package/dist/report-view-model.js$' >/dev/null; then
            echo 'Retired report view-model export must not be packaged.' >&2
            exit 1
          fi
          tar -tzf "${{ steps.pack.outputs.tarball }}" | grep '^package/dist/logo.js$' >/dev/null

          nuxt_smoke="$smoke_root/nuxt-layer-consumer"
          cp -R "$GITHUB_WORKSPACE/test/fixtures/nuxt-layer-consumer" "$nuxt_smoke"
          npm install --prefix "$nuxt_smoke" --ignore-scripts
          npm install --prefix "$nuxt_smoke" --ignore-scripts --no-save \
            "${{ steps.pack.outputs.tarball }}"
          npm run --prefix "$nuxt_smoke" prepare:nuxt
          npm run --prefix "$nuxt_smoke" typecheck
          npm run --prefix "$nuxt_smoke" build

          pnpm_smoke="$smoke_root/pnpm-nuxt-layer-consumer"
          cp -R "$GITHUB_WORKSPACE/test/fixtures/nuxt-layer-consumer" "$pnpm_smoke"
          pnpm --dir "$pnpm_smoke" install --ignore-scripts
          pnpm --dir "$pnpm_smoke" add --ignore-scripts --save-dev \
            "${{ steps.pack.outputs.tarball }}"
          pnpm --dir "$pnpm_smoke" run prepare:nuxt
          pnpm --dir "$pnpm_smoke" run typecheck
          pnpm --dir "$pnpm_smoke" run build

          "$GITHUB_WORKSPACE/node_modules/.bin/playwright" install --with-deps chromium
          node "$GITHUB_WORKSPACE/scripts/check-packed-diagrams.mjs" "$nuxt_smoke" "$pnpm_smoke"

          view_project="$smoke_root/view-project"
          view_runner="$smoke_root/view-runner"
          mkdir -p "$view_project" "$view_runner"
          cp -R "$GITHUB_WORKSPACE/test/fixtures/fixture-shop/." "$view_project"
          git -C "$view_project" init --initial-branch=main
          git -C "$view_project" config user.email fixture@example.com
          git -C "$view_project" config user.name Fixture
          git -C "$view_project" add .
          git -C "$view_project" commit -m fixture
          npm install --prefix "$view_runner" --ignore-scripts "${{ steps.pack.outputs.tarball }}"

          view_log="$smoke_root/view.log"
          node "$view_runner/node_modules/pdd-toolkit/dist/cli.js" \
            --cwd "$view_project" view --no-open >"$view_log" 2>&1 &
          viewer_pid=$!
          cleanup_viewer() {
            if kill -0 "$viewer_pid" 2>/dev/null; then kill -TERM "$viewer_pid"; fi
          }
          trap cleanup_viewer EXIT
          for _ in $(seq 1 50); do
            viewer_url="$(sed -n 's/^Viewing the local Product Model at \(http:\/\/127\.0\.0\.1:[0-9]*\)$/\1/p' "$view_log")"
            if [[ -n "$viewer_url" ]]; then break; fi
            if ! kill -0 "$viewer_pid" 2>/dev/null; then cat "$view_log"; exit 1; fi
            sleep 0.2
          done
          test -n "$viewer_url"
          curl --fail --silent "$viewer_url/_pdd-kit/health" | grep '"ok":true' >/dev/null
          curl --fail --silent "$viewer_url/" | grep -i '<!DOCTYPE html>' >/dev/null
          curl --fail --silent "$viewer_url/brand/icons/favicon.svg" | grep '<svg' >/dev/null
          curl --fail --silent "$viewer_url/_pdd-kit/report.json" \
            | grep '"id":"fixture-shop"' >/dev/null
          curl --fail --silent "$viewer_url/_pdd-kit/logo.svg" \
            | grep '<svg' >/dev/null
          curl --fail --silent "$viewer_url/brand/icons/favicon.svg" \
            | grep '<svg' >/dev/null
          test ! -e "$view_project/product-model/build/report.json"
          kill -TERM "$viewer_pid"
          wait "$viewer_pid"
          trap - EXIT

      - name: Publish to npm
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if npm view "pdd-toolkit@${package_version}" version >/dev/null 2>&1; then
            echo "pdd-toolkit@${package_version} is already published; skipping."
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.tarball }}"

  # Watching a repository's releases notifies on Releases, never on bare tags,
  # so each version gets one once npm can install it, its notes taken from
  # CHANGELOG.md. A separate job keeps write access out of the npm publisher.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          node scripts/release-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
