name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared package version to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'businesslens/pdd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Verify prepared release
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(node --print "require('./package.json').version")"
          if [[ "$EXPECTED_VERSION" != "$version" ]]; then
            echo "Requested version $EXPECTED_VERSION does not match package version $version." >&2
            exit 1
          fi
          if ! grep --fixed-strings "## [$version]" CHANGELOG.md >/dev/null; then
            echo "CHANGELOG.md has no release heading for $version." >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm run verify

      - name: Tag release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "$TAG"
          git push origin "$TAG"
